---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sample-nginx
  namespace: sample-app
  labels:
    app: sample-nginx
    app.kubernetes.io/part-of: argocd-gitops-platform
spec:
  podSelector:
    matchLabels:
      app: sample-nginx
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
